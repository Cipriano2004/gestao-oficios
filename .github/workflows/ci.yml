name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gestao_oficios_test
          MYSQL_USER: oficios_app
          MYSQL_PASSWORD: senha_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SECRET_KEY: chave-do-ci
      DATABASE_URL: mysql+pymysql://oficios_app:senha_ci@127.0.0.1:3306/gestao_oficios_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://oficios_app:senha_ci@127.0.0.1:3306/gestao_oficios_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Migrações aplicam do zero no MySQL
        run: flask --app run.py db upgrade && flask --app run.py db downgrade base
      - name: Testes (MySQL, incluindo concorrência)
        run: pytest --cov=app --cov-report=term-missing
      - name: Testes (SQLite)
        env:
          TEST_DATABASE_URL: "sqlite://"
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t gestao-oficios:ci .
