# Sobe o sistema completo: MySQL 8 + aplicação.
#   1) copy .env.example .env   (e troque as senhas)
#   2) docker compose up --build
#   3) docker compose exec app flask seed          (dados fictícios, opcional)
#      docker compose exec app flask criar-admin   (primeiro usuário)
#   Acesse http://localhost:8000

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gestao_oficios
      MYSQL_USER: oficios_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dados_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Banco não fica exposto fora do Docker. Para acessar com um cliente local, descomente:
    # ports: ["127.0.0.1:3307:3306"]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: mysql+pymysql://oficios_app:${MYSQL_PASSWORD}@db:3306/gestao_oficios?charset=utf8mb4
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  dados_mysql:
