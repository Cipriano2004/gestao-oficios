<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block codigo %}{% endblock %} · Gestão de Ofícios</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <script src="{{ url_for('static', filename='js/tema.js') }}"></script>
  <link href="{{ url_for('static', filename='vendor/inter/inter.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
  <main class="login-pagina">
    <div class="text-center" style="max-width: 440px">
      <div class="login-card card mx-auto">
        <span class="kpi p-0 justify-content-center mb-3"><span class="icone {% block tom %}tom-azul{% endblock %}" style="width:56px;height:56px;font-size:1.6rem"><i class="bi bi-{% block icone %}{% endblock %}"></i></span></span>
        <div class="mono text-muted small mb-1">Erro {{ self.codigo() }}</div>
        <h1 class="h4 fw-bold">{% block titulo %}{% endblock %}</h1>
        <p class="text-muted">{% block texto %}{% endblock %}</p>
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary"><i class="bi bi-arrow-left me-1"></i>Voltar ao início</a>
      </div>
    </div>
  </main>
</body>
</html>
